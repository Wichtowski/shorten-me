name: PR Code Checks

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/pr-code-checks.yaml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/pr-code-checks.yaml"

permissions:
  contents: read

concurrency:
  group: pr-code-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit --project tsconfig.json

      - name: Build
        run: bun run build
